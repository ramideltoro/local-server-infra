---
- name: Enroll Mookie without replacing its OS or applications
  hosts: mookie
  become: true
  gather_facts: true
  tasks:
    - name: Verify expected host
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname == 'mookie'
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.architecture == 'aarch64'
    - name: Detect memory controller
      ansible.builtin.command: cat /sys/fs/cgroup/cgroup.controllers
      register: controllers
      changed_when: false
    - name: Preserve boot arguments outside the FAT boot partition
      ansible.builtin.copy:
        src: /boot/firmware/cmdline.txt
        dest: /var/lib/mookie-cmdline.before-observability
        remote_src: true
        force: false
        mode: '0600'
      when: "'memory' not in controllers.stdout.split()"
    - name: Enable Raspberry Pi memory cgroups when absent
      ansible.builtin.lineinfile:
        path: /boot/firmware/cmdline.txt
        regexp: '^((?!.*cgroup_enable=memory).*)$'
        line: '\1 cgroup_enable=memory'
        backrefs: true
        backup: false
      when: "'memory' not in controllers.stdout.split()"
      register: memory_boot
    - name: Activate memory limits on newly enrolled Pi
      ansible.builtin.reboot:
        reboot_timeout: 240
        post_reboot_delay: 10
      when: memory_boot.changed
    - name: Require enforceable memory limits
      ansible.builtin.command: cat /sys/fs/cgroup/cgroup.controllers
      register: enabled_controllers
      changed_when: false
      failed_when: "'memory' not in enabled_controllers.stdout.split()"
    - name: Install transport dependencies
      ansible.builtin.apt:
        name: [ca-certificates, curl]
        update_cache: true
        cache_valid_time: 3600
    - name: Create package key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
    - name: Trust official Grafana package signing key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg-full.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: '0644'
    - name: Configure official Grafana repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/grafana.list
        content: 'deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main'
        mode: '0644'
    - name: Install Alloy
      ansible.builtin.apt:
        name: alloy
        state: present
        update_cache: true
    - name: Permit private journal collection
      ansible.builtin.user:
        name: alloy
        groups: systemd-journal
        append: true
    - name: Create hardware metrics directory
      ansible.builtin.file:
        path: /var/lib/mookie-observability
        state: directory
        mode: '0755'
    - name: Install bounded hardware collector
      ansible.builtin.copy:
        src: ../services/mookie/hardware.sh
        dest: /usr/local/sbin/mookie-observability-hardware
        mode: '0755'
    - name: Install hardware collector service
      ansible.builtin.copy:
        dest: /etc/systemd/system/mookie-observability-hardware.service
        mode: '0644'
        content: |
          [Unit]
          Description=Mookie hardware telemetry
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/mookie-observability-hardware
          TimeoutStartSec=10
          MemoryMax=32M
          CPUQuota=10%
          Nice=15
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
          ReadWritePaths=/var/lib/mookie-observability
    - name: Install hardware timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/mookie-observability-hardware.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Collect Mookie hardware telemetry every minute
          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=60s
          [Install]
          WantedBy=timers.target
    - name: Install private Cloud ingestion environment
      ansible.builtin.copy:
        content: "{{ lookup('env', 'MOOKIE_TELEMETRY_ENV') }}"
        dest: /etc/alloy/mookie.env
        owner: root
        group: root
        mode: '0600'
      no_log: true
    - name: Install Alloy configuration
      ansible.builtin.copy:
        src: templates/mookie.alloy
        dest: /etc/alloy/config.alloy
        mode: '0644'
        backup: true
    - name: Create Alloy service override directory
      ansible.builtin.file:
        path: /etc/systemd/system/alloy.service.d
        state: directory
        mode: '0755'
    - name: Limit collector resources and bind loopback
      ansible.builtin.copy:
        dest: /etc/systemd/system/alloy.service.d/observability.conf
        mode: '0644'
        content: |
          [Service]
          EnvironmentFile=/etc/alloy/mookie.env
          Environment="CUSTOM_ARGS=--server.http.listen-addr=127.0.0.1:12345"
          MemoryMax=384M
          CPUQuota=35%
          Nice=15
          NoNewPrivileges=true
    - name: Validate configuration with private environment
      ansible.builtin.shell: |
        set -a
        . /etc/alloy/mookie.env
        /usr/bin/alloy validate /etc/alloy/config.alloy
      args:
        executable: /bin/bash
      no_log: true
    - name: Start hardware sampling
      ansible.builtin.systemd_service:
        name: mookie-observability-hardware.timer
        daemon_reload: true
        enabled: true
        state: started
    - name: Start first hardware sample
      ansible.builtin.systemd_service:
        name: mookie-observability-hardware.service
        state: started
    - name: Start collector
      ansible.builtin.systemd_service:
        name: alloy
        daemon_reload: true
        enabled: true
        state: restarted
    - name: Verify collector readiness
      ansible.builtin.uri:
        url: http://127.0.0.1:12345/-/ready
      register: readiness
      until: readiness.status == 200
      retries: 12
      delay: 5
