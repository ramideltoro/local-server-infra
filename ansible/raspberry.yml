---
- name: Enroll Raspberry receiver without replacing its OS or applications
  hosts: raspberry
  become: true
  gather_facts: true
  tasks:
    - name: Verify expected host
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname == 'rpi4'
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.architecture == 'aarch64'
    - name: Install transport dependencies
      ansible.builtin.apt:
        name: [ca-certificates, curl]
        update_cache: true
        cache_valid_time: 3600
    - name: Create package key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
    - name: Trust official Grafana package signing key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg-full.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: '0644'
    - name: Configure official Grafana repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/grafana.list
        content: 'deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main'
        mode: '0644'
    - name: Install Alloy
      ansible.builtin.apt:
        name: alloy
        state: present
        update_cache: true
    - name: Permit private journal collection
      ansible.builtin.user:
        name: alloy
        groups: systemd-journal
        append: true
    - name: Create hardware metrics directory
      ansible.builtin.file:
        path: /var/lib/raspberry-observability
        state: directory
        mode: '0755'
    - name: Install bounded hardware collector
      ansible.builtin.copy:
        src: ../services/raspberry/hardware.sh
        dest: /usr/local/sbin/raspberry-observability-hardware
        mode: '0755'
    - name: Install hardware collector service
      ansible.builtin.copy:
        dest: /etc/systemd/system/raspberry-observability-hardware.service
        mode: '0644'
        content: |
          [Unit]
          Description=Raspberry receiver hardware telemetry
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/raspberry-observability-hardware
          TimeoutStartSec=10
          MemoryMax=32M
          CPUQuota=10%
          Nice=15
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
          ReadWritePaths=/var/lib/raspberry-observability
    - name: Install hardware timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/raspberry-observability-hardware.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Collect Raspberry receiver hardware telemetry every minute
          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=60s
          [Install]
          WantedBy=timers.target
    - name: Install private Cloud ingestion environment
      ansible.builtin.copy:
        content: "{{ lookup('env', 'RASPBERRY_TELEMETRY_ENV') }}"
        dest: /etc/alloy/raspberry.env
        owner: root
        group: root
        mode: '0600'
      no_log: true
    - name: Install Alloy configuration
      ansible.builtin.copy:
        src: templates/raspberry.alloy
        dest: /etc/alloy/config.alloy
        mode: '0644'
        backup: true
    - name: Create Alloy service override directory
      ansible.builtin.file:
        path: /etc/systemd/system/alloy.service.d
        state: directory
        mode: '0755'
    - name: Limit collector resources and bind loopback
      ansible.builtin.copy:
        dest: /etc/systemd/system/alloy.service.d/observability.conf
        mode: '0644'
        content: |
          [Service]
          EnvironmentFile=/etc/alloy/raspberry.env
          Environment="CUSTOM_ARGS=--server.http.listen-addr=127.0.0.1:12345"
          MemoryMax=384M
          CPUQuota=35%
          Nice=15
          NoNewPrivileges=true
    - name: Validate configuration with private environment
      ansible.builtin.shell: |
        set -a
        . /etc/alloy/raspberry.env
        /usr/bin/alloy validate /etc/alloy/config.alloy
      args:
        executable: /bin/bash
      no_log: true
    - name: Start hardware sampling
      ansible.builtin.systemd_service:
        name: raspberry-observability-hardware.timer
        daemon_reload: true
        enabled: true
        state: started
    - name: Start first hardware sample
      ansible.builtin.systemd_service:
        name: raspberry-observability-hardware.service
        state: started
    - name: Start collector
      ansible.builtin.systemd_service:
        name: alloy
        daemon_reload: true
        enabled: true
        state: restarted
    - name: Verify collector readiness
      ansible.builtin.uri:
        url: http://127.0.0.1:12345/-/ready
      register: readiness
      until: readiness.status == 200
      retries: 12
      delay: 5
    - name: Install read-only off-host backup exporter
      ansible.builtin.copy:
        src: ../services/raspberry/recovery-export.sh
        dest: /usr/local/sbin/observe-raspberry-export
        owner: root
        group: root
        mode: '0755'
        validate: /bin/bash -n %s
    - name: Validate dedicated recovery public key
      ansible.builtin.assert:
        that:
          - lookup('env', 'RASPBERRY_RECOVERY_PUBLIC_KEY') is match('^ssh-ed25519 [A-Za-z0-9+/=]+ observe-raspberry-backup$')
    - name: Create SSH directory if absent
      ansible.builtin.file:
        path: /home/piadmin/.ssh
        state: directory
        owner: piadmin
        group: piadmin
        mode: '0700'
    - name: Add only the forced-command recovery key
      ansible.builtin.lineinfile:
        path: /home/piadmin/.ssh/authorized_keys
        create: true
        owner: piadmin
        group: piadmin
        mode: '0600'
        line: 'restrict,command="sudo -n /usr/local/sbin/observe-raspberry-export \"$SSH_ORIGINAL_COMMAND\"" {{ lookup("env", "RASPBERRY_RECOVERY_PUBLIC_KEY") }}'
    - name: Permit only the two backup export operations without an interactive password
      ansible.builtin.copy:
        dest: /etc/sudoers.d/observe-raspberry-export
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s
        content: |
          piadmin ALL=(root) NOPASSWD: /usr/local/sbin/observe-raspberry-export revision, /usr/local/sbin/observe-raspberry-export archive
